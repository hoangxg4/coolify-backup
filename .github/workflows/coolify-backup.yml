name: Coolify Backup

on:
  push:
    branches: [master]
    paths: ['.github/workflows/coolify-backup.yml']
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      debug_server:          # Debug: backup only this single server IP
        description: 'DEBUG: only backup this server IP (empty = all servers)'
        required: false
        default: ''
      debug:                 # Debug: verbose logs (default: hidden)
        description: 'DEBUG: show verbose logs (file listings, rclone diagnostics)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # push the status report branch
  actions: write    # delete old workflow runs

jobs:
  get-servers:
    runs-on: ubuntu-latest
    outputs:
      servers_json: ${{ steps.fetch.outputs.servers_json }}
      server_count: ${{ steps.fetch.outputs.server_count }}
      batch_list: ${{ steps.fetch.outputs.batch_list }}
      resources_json: ${{ steps.fetch.outputs.resources_json }}
      api_ok: ${{ steps.fetch.outputs.api_ok }}
    steps:
      - name: Fetch server list from Coolify API
        id: fetch
        run: |
          # --- fetch-step:begin ---
          # Number of parallel matrix batches (tune as needed)
          MATRIX_BATCHES=10
          API_OK=true
          RESPONSE=''
          SERVERS_VALID=false

          # Header via stdin (@-) — keeps bearer token off process argv/ps
          coolify_curl() {
            printf 'Authorization: Bearer %s\n' "$COOLIFY_API_TOKEN" \
              | curl -sS --max-time 30 --retry 2 -H @- "$@"
          }

          RESPONSE=$(coolify_curl "$COOLIFY_API_URL/servers" || true)
          if echo "$RESPONSE" | jq -e 'type=="array"' >/dev/null 2>&1; then
            SERVERS_VALID=true
          fi

          if [ -n "$DEBUG_SERVER" ]; then
            # DEBUG MODE: backup only the single server provided via workflow_dispatch
            MATRIX_BATCHES=1
            SERVER_COUNT=1
            if [ "$SERVERS_VALID" = true ]; then
              SERVERS_JSON=$(echo "$RESPONSE" | jq -c --arg ip "$DEBUG_SERVER" '[.[].ip | select(.==$ip)]')
              if [ "$SERVERS_JSON" = "[]" ]; then
                SERVERS_JSON=$(printf '%s' "$DEBUG_SERVER" | jq -R -c '[.]')
              fi
            else
              SERVERS_JSON=$(printf '%s' "$DEBUG_SERVER" | jq -R -c '[.]')
              API_OK=false
              echo "::warning::/servers fetch failed in debug mode - full-backup fallback"
            fi
          else
            if [ "$SERVERS_VALID" != true ]; then
              echo "::error::Coolify /servers returned invalid or non-array response"
              exit 1
            fi
            SERVERS_JSON=$(echo "$RESPONSE" | jq -c '[.[].ip]')
            SERVER_COUNT=$(echo "$SERVERS_JSON" | jq 'length')
            if [ "$SERVER_COUNT" -eq 0 ]; then
              echo "::warning::No servers returned by API. Check COOLIFY_API_URL and COOLIFY_API_TOKEN."
              SERVERS_JSON='[]'
              SERVER_COUNT=0
            fi
          fi

          # Build per-IP resource map via GET /servers/{uuid}/resources (N+1, soft-fail)
          RESOURCES_JSON='{}'
          PAIRS=''
          if [ "$API_OK" = true ] && [ "$SERVERS_VALID" = true ]; then
            PAIRS=$(echo "$RESPONSE" | jq -c '[.[] | {uuid, ip}]' 2>/dev/null || true)
            if ! echo "$PAIRS" | jq -e 'type=="array"' >/dev/null 2>&1; then
              PAIRS=''
              API_OK=false
            fi
          fi
          if [ "$API_OK" = true ] && [ -n "$PAIRS" ]; then
            if [ -n "$DEBUG_SERVER" ]; then
              PAIRS=$(echo "$PAIRS" | jq -c --arg ip "$DEBUG_SERVER" '[.[] | select(.ip==$ip)]' 2>/dev/null || echo '[]')
            fi
            while IFS=' ' read -r uuid ip; do
              if [ -z "$uuid" ] || [ -z "$ip" ]; then
                continue
              fi
              RES=$(coolify_curl "$COOLIFY_API_URL/servers/$uuid/resources" || true)
              if ! echo "$RES" | jq -e 'type=="array" and all(.[]; type=="object")' >/dev/null 2>&1; then
                echo "::warning::resource mapping failed for $ip - full-backup fallback for all servers"
                API_OK=false
                RESOURCES_JSON='{}'
                break
              fi
              if ! KINDS=$(echo "$RES" | jq -c '{
                applications: [.[] | select(.type=="application") | .uuid],
                services:     [.[] | select(.type=="service")     | .uuid],
                databases:    [.[] | select(.type!="application" and .type!="service") | .uuid]
              }'); then
                echo "::warning::resource mapping parse failed for $ip - full-backup fallback"
                API_OK=false
                RESOURCES_JSON='{}'
                break
              fi
              if ! RESOURCES_JSON=$(jq -c --arg ip "$ip" --argjson k "$KINDS" '.[$ip]=$k' <<<"$RESOURCES_JSON"); then
                echo "::warning::resource map merge failed for $ip - full-backup fallback"
                API_OK=false
                RESOURCES_JSON='{}'
                break
              fi
            done < <(jq -r '.[] | "\(.uuid) \(.ip)"' <<<"$PAIRS" 2>/dev/null || true)
          fi
          if [ "$API_OK" = true ] && [ "${SERVER_COUNT:-0}" -gt 0 ] && [ "$RESOURCES_JSON" = "{}" ]; then
            # Servers exist but map is empty (e.g. debug IP not in /servers) - don't claim filtered mode
            API_OK=false
          fi
          if [ "$API_OK" = false ]; then
            RESOURCES_JSON='{}'
          fi

          # Dynamic matrix: batches, servers are divided evenly later
          BATCH_LIST=$(seq 0 $((MATRIX_BATCHES - 1)) | jq -c -s '.')

          echo "servers_json=$SERVERS_JSON" >> $GITHUB_OUTPUT
          echo "server_count=$SERVER_COUNT" >> $GITHUB_OUTPUT
          echo "batch_list=$BATCH_LIST" >> $GITHUB_OUTPUT
          echo "resources_json=$RESOURCES_JSON" >> $GITHUB_OUTPUT
          echo "api_ok=$API_OK" >> $GITHUB_OUTPUT
          echo "Found $SERVER_COUNT servers, running $MATRIX_BATCHES parallel batches (api_ok=$API_OK)"
          # --- fetch-step:end ---
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEBUG_SERVER: ${{ inputs.debug_server }}

  backup:
    needs: get-servers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: ${{ fromJSON(needs.get-servers.outputs.batch_list) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            User root
            IdentitiesOnly yes
            BatchMode yes
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone rsync jq
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Backup servers in parallel
        run: |
          # Divide servers evenly across 10 batches (ceil division)
          MATRIX_BATCHES=10
          BATCH_SIZE=$(( (SERVER_COUNT + MATRIX_BATCHES - 1) / MATRIX_BATCHES ))
          START=$((MATRIX_BATCH * BATCH_SIZE))
          END=$((START + BATCH_SIZE))

          SERVERS=$(echo "$SERVERS_JSON" | jq -r '.[]' | \
            sed -n "$((START+1)),${END}p")

          if [ -z "$SERVERS" ]; then
            echo "No servers in this batch"
            exit 0
          fi

          echo "Backing up servers: $SERVERS"
          if [ -z "${RESOURCES_JSON:-}" ]; then RESOURCES_JSON='{}'; fi

          cat > backup_server.sh << 'SCRIPT'
          #!/bin/bash
          SERVER_IP=$1
          # Reject shell-metacharacters in API-supplied address (IPv4/IPv6/hostname OK)
          if [ -z "$SERVER_IP" ] || printf '%s' "$SERVER_IP" | grep -qE '[^0-9A-Za-z.:_-]'; then
            echo "FAIL|$SERVER_IP|invalid server address" >> /tmp/batch_results.txt
            exit 0
          fi
          BACKUP_DIR="./backups/$SERVER_IP"
          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          LOG_FILE="/tmp/backup_${SERVER_IP}.log"
          exec > >(tee "$LOG_FILE") 2>&1

          echo "Starting backup: $SERVER_IP"

          # Single SSH connection: stream the remote script on stdin, tarball back on stdout.
          OUT_FILE="$BACKUP_DIR/coolify_backup_${TIMESTAMP}.tar.gz"

          # Per-server outcome records for the status report (shared path, parallel-safe O_APPEND)
          RESULTS_FILE=/tmp/batch_results.txt
          ERR_FILE="/tmp/backup_${SERVER_IP}.err"

          if [ -z "${RESOURCES_JSON:-}" ]; then RESOURCES_JSON='{}'; fi
          ENTRY=$(jq -c --arg ip "$SERVER_IP" '.[$ip] // empty' <<<"$RESOURCES_JSON" 2>/dev/null || true)
          if [ -n "$ENTRY" ]; then
            MODE=filtered
          else
            MODE=fallback
            echo "::warning::No resource mapping for $SERVER_IP - full backup fallback"
          fi
          ENTRY_B64=$(printf '%s' "$ENTRY" | base64 -w0 2>/dev/null || printf '%s' "$ENTRY" | base64)

          REMOTE_SCRIPT=$(mktemp)
          cat > "$REMOTE_SCRIPT" << 'REMOTE'
          cd /tmp || exit 1
          SCRATCH=$(mktemp -d)
          trap 'rm -rf "$SCRATCH"; rm -f coolify_data.tar.gz vol_*.tar.gz vol_list.txt' EXIT

          backup_volumes_from_list() {
            [ -s vol_list.txt ] || return 0
            xargs -P 5 -I {} docker run --rm -v {}:/data -v /tmp:/backup alpine \
              tar czf /backup/vol_{}.tar.gz -C / data 2>/dev/null < vol_list.txt
            return 0
          }
          backup_volumes_all() {
            docker volume ls -q 2>/dev/null | xargs -P 5 -I {} \
              docker run --rm -v {}:/data -v /tmp:/backup alpine \
              tar czf /backup/vol_{}.tar.gz -C / data 2>/dev/null
            return 0
          }
          build_volumes_filtered() {
            : > vol_list.txt
            EXISTING_VOLS="$SCRATCH/existing_vols"
            docker volume ls -q 2>/dev/null > "$EXISTING_VOLS" || true
            UUID_FILE="$SCRATCH/uuid_filter"
            jq -r '.applications[]?, .databases[]?, .services[]?' <<<"$DEC" > "$UUID_FILE" 2>/dev/null || true
            if [ -s "$UUID_FILE" ]; then
              grep -F -f "$UUID_FILE" "$EXISTING_VOLS" >> vol_list.txt || true
            fi
            docker ps -aq --filter "label=coolify.managed=true" 2>/dev/null | \
              xargs -r docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' 2>/dev/null \
              >> vol_list.txt || true
            # core volumes ONLY if they already exist (never auto-create via docker run -v)
            printf '%s\n' coolify-db coolify-redis > "$SCRATCH/core_vols"
            grep -Fx -f "$SCRATCH/core_vols" "$EXISTING_VOLS" >> vol_list.txt || true
            sort -u vol_list.txt -o vol_list.txt
          }

          if [ "$MODE" = "filtered" ]; then
            DEC=$(printf '%s' "$ENTRY_B64" | base64 -d 2>/dev/null || echo '{}')
            INCLUDE=()
            for d in source ssh backups images; do
              [ -d "/data/coolify/$d" ] && INCLUDE+=("data/coolify/$d")
            done
            for kind in applications databases services; do
              while IFS= read -r u; do
                [ -n "$u" ] || continue
                [ -d "/data/coolify/$kind/$u" ] && INCLUDE+=("data/coolify/$kind/$u")
              done < <(jq -r --arg k "$kind" '.[$k][]?' <<<"$DEC" 2>/dev/null || true)
            done
            if [ ${#INCLUDE[@]} -gt 0 ]; then
              tar czf coolify_data.tar.gz -C / "${INCLUDE[@]}" 2>/dev/null || \
                echo "warn: /data/coolify missing or unreadable on $SRV_IP" >&2
            else
              # Distinct from "missing" so report reason stays accurate when volumes still succeed
              echo "warn: no matching resource paths on $SRV_IP" >&2
            fi
            build_volumes_filtered
            backup_volumes_from_list
          else
            tar czf coolify_data.tar.gz -C / data/coolify 2>/dev/null || \
              echo "warn: /data/coolify missing or unreadable on $SRV_IP" >&2
            backup_volumes_all
          fi

          FILES=""
          [ -f coolify_data.tar.gz ] && FILES="$FILES coolify_data.tar.gz"
          for f in vol_*.tar.gz; do [ -f "$f" ] && FILES="$FILES $f"; done
          [ -n "$FILES" ] || {
            if [ "$MODE" = "filtered" ]; then exit 42; fi
            echo "error: nothing to back up on $SRV_IP" >&2
            exit 1
          }
          tar czf - $FILES
          REMOTE

          if timeout 300 ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -i ~/.ssh/id_rsa "root@$SERVER_IP" \
            "MODE='$MODE' ENTRY_B64='$ENTRY_B64' SRV_IP='$SERVER_IP' bash -s" \
            < "$REMOTE_SCRIPT" > "$OUT_FILE" 2> "$ERR_FILE"; then
            RC=0
          else
            RC=$?
          fi
          rm -f "$REMOTE_SCRIPT"

          if [ "$RC" -eq 0 ]; then
            if [ "$MODE" = "fallback" ]; then
              # Approved Q3: fallback successes are PARTIAL, never OK
              echo "PARTIAL|$SERVER_IP|no resource mapping: full backup" >> "$RESULTS_FILE"
              echo "::warning::$SERVER_IP backed up in FULL fallback mode (no resource mapping)"
            elif grep -q "warn: no matching resource paths" "$ERR_FILE" 2>/dev/null; then
              echo "PARTIAL|$SERVER_IP|no matching resource paths, volumes only" >> "$RESULTS_FILE"
            elif grep -q "warn: /data/coolify missing" "$ERR_FILE" 2>/dev/null; then
              echo "PARTIAL|$SERVER_IP|data/coolify missing, volumes only" >> "$RESULTS_FILE"
            else
              echo "OK|$SERVER_IP" >> "$RESULTS_FILE"
            fi
            if [ "$DEBUG" = "true" ]; then
              echo "Backup file for $SERVER_IP:"
              ls -la "$BACKUP_DIR"
              du -sh "$BACKUP_DIR" 2>/dev/null || true
            fi
            echo "Completed: $SERVER_IP (mode=$MODE)"
          elif [ "$RC" -eq 42 ]; then
            rm -f "$OUT_FILE"
            echo "::warning::Nothing matched on $SERVER_IP (no core dirs, no resource data, no volumes)"
            echo "PARTIAL|$SERVER_IP|no matching resource data on server" >> "$RESULTS_FILE"
          else
            REASON="backup failed (ssh rc=$RC)"
            grep -q "nothing to back up" "$ERR_FILE" 2>/dev/null && \
              REASON="nothing to back up (no /data/coolify, no volumes)"
            rm -f "$OUT_FILE"
            echo "::warning::Backup failed for $SERVER_IP (ssh rc=$RC)"
            echo "FAIL|$SERVER_IP|$REASON" >> "$RESULTS_FILE"
          fi
          rm -f "$ERR_FILE"
          exit 0
          SCRIPT
          chmod +x backup_server.sh

          echo "$SERVERS" | xargs -P 10 -I {} bash backup_server.sh {} || true
        env:
          SERVERS_JSON: ${{ needs.get-servers.outputs.servers_json }}
          SERVER_COUNT: ${{ needs.get-servers.outputs.server_count }}
          RESOURCES_JSON: ${{ needs.get-servers.outputs.resources_json }}
          MATRIX_BATCH: ${{ matrix.batch }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEBUG: ${{ inputs.debug }}

      - name: Upload batch backups to remote
        id: upload
        if: always()
        run: |
          # RCLONE_REMOTE sanity checks: always run, fail safe as a warning so
          # the job stays green while still being loud in the logs.
          if [ -z "$RCLONE_REMOTE" ]; then
            echo "::warning::RCLONE_REMOTE is EMPTY (misconfigured secret?) - skipping upload"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$RCLONE_REMOTE" =~ ^[A-Za-z0-9_]+: ]]; then
            echo "::warning::RCLONE_REMOTE must be '<remote-name>:<base-path>' (e.g. 'hf:coolify-backups'). Current value has NO 'remote:' prefix - backups would be written to a LOCAL path and lost. Skipping upload."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE_NAME="${RCLONE_REMOTE%%:*}"
          if ! rclone listremotes 2>/dev/null | grep -qx "${REMOTE_NAME}:"; then
            echo "::warning::rclone remote '${REMOTE_NAME}' not found in RCLONE_CONFIG - skipping upload"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DEBUG" = "true" ]; then
            echo "=== DEBUG: upload step ==="
            echo "pwd: $(pwd)"
            echo "--- files under ./backups (with sizes) ---"
            find ./backups -type f -printf '%p %s bytes\n' 2>/dev/null || echo "(no ./backups dir)"
            echo "--- configured remotes ---"
            rclone listremotes 2>&1 || true
            echo "--- remote root listing BEFORE upload ---"
            rclone lsf "$RCLONE_REMOTE/" --max-depth 2 2>&1 | head -20 || true
            echo "=== DEBUG end ==="
          fi

          if [ ! -d "./backups" ] || [ -z "$(ls -A ./backups 2>/dev/null)" ]; then
            echo "No backups to upload"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parallel upload: one rclone copy per server dir
          ls -d ./backups/*/ 2>/dev/null | \
            xargs -P 5 -I DIR bash -c '
              SERVER_IP=$(basename "$1")
              echo "Uploading backups for $SERVER_IP..."
              if timeout 600 rclone copy "$1" "$RCLONE_REMOTE/$SERVER_IP/" \
                  -q --transfers 4 --checkers 8; then
                if [ "$DEBUG" = "true" ]; then
                  echo "  -> remote listing after copy for $SERVER_IP:"
                  rclone lsf "$RCLONE_REMOTE/$SERVER_IP/" 2>&1 | head -10 || true
                fi
              else
                echo "::warning::rclone copy FAILED for $SERVER_IP"
                echo "UPLOAD_FAIL|$SERVER_IP|rclone copy failed" >> /tmp/batch_results.txt
              fi
            ' _ DIR || true

          echo "All uploads complete"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          DEBUG: ${{ inputs.debug }}

      - name: Cleanup local
        # always() is REQUIRED: without it, GitHub skips the step entirely
        # (without evaluating `if:`) when any earlier step in the job failed.
        if: always() && steps.upload.outputs.uploaded == 'true'
        run: rm -rf ./backups/

      - name: Upload backup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-logs-batch-${{ matrix.batch }}
          path: /tmp/backup*.log
          retention-days: 7

      - name: Emit batch results JSON
        id: results
        if: always()
        run: |
          # Compact per-batch summary consumed by the report job.
          # NOTE: written to a FILE, not a job output — GitHub matrix jobs with
          # a shared output key only expose the LAST instance's value, so the
          # report job aggregates per-batch artifacts instead.
          RESULTS_FILE=/tmp/batch_results.txt
          BATCH=$MATRIX_BATCH
          TOTAL=0; OK=0
          FAILED_JSON='[]'; PARTIAL_JSON='[]'; UPFAIL_JSON='[]'
          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(grep -cE '^(OK|FAIL|PARTIAL)\|' "$RESULTS_FILE" || true)
            OK=$(grep -c '^OK|' "$RESULTS_FILE" || true)
            FAILED=$(grep '^FAIL|' "$RESULTS_FILE" | \
              awk -F'|' '{printf "{\"host\":\"%s\",\"reason\":\"%s\"},", $2, $3}' | sed 's/,$//')
            [ -n "$FAILED" ] && FAILED_JSON="[$FAILED]"
            PARTIAL=$(grep '^PARTIAL|' "$RESULTS_FILE" | \
              awk -F'|' '{printf "{\"host\":\"%s\",\"reason\":\"%s\"},", $2, $3}' | sed 's/,$//')
            [ -n "$PARTIAL" ] && PARTIAL_JSON="[$PARTIAL]"
            UPFAIL=$(grep '^UPLOAD_FAIL|' "$RESULTS_FILE" | \
              awk -F'|' '{printf "{\"host\":\"%s\",\"reason\":\"%s\"},", $2, $3}' | sed 's/,$//')
            [ -n "$UPFAIL" ] && UPFAIL_JSON="[$UPFAIL]"
          fi
          JSON=$(printf '{"batch":%d,"total":%d,"ok":%d,"failed":%s,"partial":%s,"upload_failed":%s}' \
            "$BATCH" "$TOTAL" "$OK" "$FAILED_JSON" "$PARTIAL_JSON" "$UPFAIL_JSON")
          mkdir -p /tmp/batch_results
          echo "$JSON" > "/tmp/batch_results/batch_${BATCH}.json"
        env:
          MATRIX_BATCH: ${{ matrix.batch }}

      - name: Upload batch results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-results-${{ matrix.batch }}
          path: /tmp/batch_results/batch_*.json
          retention-days: 7
          if-no-files-found: ignore

  cleanup:
    needs: [get-servers, backup]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      summary: ${{ steps.clean.outputs.summary }}
    steps:
      - name: Setup rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Cleanup old backups (keep max 5)
        id: clean
        run: |
          # RCLONE_REMOTE sanity checks: always run, fail safe as a warning.
          if [ -z "$RCLONE_REMOTE" ]; then
            echo "::warning::RCLONE_REMOTE is EMPTY (misconfigured secret?) - skipping cleanup"
            echo "summary={\"dirs\":-1,\"deleted\":-1}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$RCLONE_REMOTE" =~ ^[A-Za-z0-9_]+: ]]; then
            echo "::warning::RCLONE_REMOTE must be '<remote-name>:<base-path>' (e.g. 'hf:coolify-backups'). Current value has NO 'remote:' prefix - skipping cleanup."
            echo "summary={\"dirs\":-1,\"deleted\":-1}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE_NAME="${RCLONE_REMOTE%%:*}"
          if ! rclone listremotes 2>/dev/null | grep -qx "${REMOTE_NAME}:"; then
            echo "::warning::rclone remote '${REMOTE_NAME}' not found in RCLONE_CONFIG - skipping cleanup"
            echo "summary={\"dirs\":-1,\"deleted\":-1}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DEBUG" = "true" ]; then
            echo "=== DEBUG: cleanup step ==="
            echo "--- configured remotes ---"
            rclone listremotes 2>&1 || true
            echo "=== DEBUG end ==="
          fi

          echo "Cleaning up old backups (parallel)..."
          rm -f /tmp/cleanup_del.txt

          cat > cleanup_server.sh << 'SCRIPT'
          #!/bin/bash
          SERVER_IP=$1
          BACKUPS=$(timeout 120 rclone lsl "$RCLONE_REMOTE/$SERVER_IP/" 2>/dev/null | \
            awk '{print $4}' | \
            grep "\.tar\.gz$" | \
            sort)
          COUNT=$(echo "$BACKUPS" | grep -c . 2>/dev/null || true)

          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ]; then
            [ "$DEBUG" = "true" ] && echo "No backups found for $SERVER_IP"
            exit 0
          fi

          if [ "$COUNT" -gt 5 ]; then
            DELETE_COUNT=$((COUNT - 5))
            echo "Deleting $DELETE_COUNT old backups for $SERVER_IP..."
            echo "$DELETE_COUNT" >> /tmp/cleanup_del.txt
            echo "$BACKUPS" | head -n "$DELETE_COUNT" | while read FILE; do
              if [ -n "$FILE" ]; then
                if timeout 120 rclone delete "$RCLONE_REMOTE/$SERVER_IP/$FILE" 2>/dev/null; then
                  [ "$DEBUG" = "true" ] && echo "  Deleted: $SERVER_IP/$FILE"
                else
                  echo "::warning::rclone delete failed: $SERVER_IP/$FILE"
                fi
              fi
            done
          else
            [ "$DEBUG" = "true" ] && echo "Keeping all $COUNT backups for $SERVER_IP (<= 5)"
          fi
          exit 0
          SCRIPT
          chmod +x cleanup_server.sh

          SERVERS=$(timeout 120 rclone lsf "$RCLONE_REMOTE/" --dirs-only 2>/dev/null | tr -d '/')

          if [ -z "$SERVERS" ]; then
            echo "No server directories found on remote - nothing to clean"
            SERVER_COUNT_CLEAN=0
          else
            SERVER_COUNT_CLEAN=$(echo "$SERVERS" | grep -c . || true)
            echo "Found $SERVER_COUNT_CLEAN server directories, cleaning (parallel)..."
            echo "$SERVERS" | xargs -P 10 -I {} bash cleanup_server.sh {} || true
          fi

          DELETED_TOTAL=$(awk '{s+=$1} END {print s+0}' /tmp/cleanup_del.txt 2>/dev/null || echo 0)
          rm -f /tmp/cleanup_del.txt
          echo "summary={\"dirs\":$SERVER_COUNT_CLEAN,\"deleted\":$DELETED_TOTAL}" >> "$GITHUB_OUTPUT"
          echo "Cleanup complete"
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          DEBUG: ${{ inputs.debug }}

  report:
    needs: [get-servers, backup, cleanup]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch to status branch
        run: |
          # status branch holds the report files; created on first run.
          git fetch origin status 2>/dev/null || true
          if git rev-parse --verify origin/status >/dev/null 2>&1; then
            git checkout -B status origin/status
          else
            git checkout --orphan status
            git rm -rf . 2>/dev/null || true
          fi

      - name: Download batch results
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: batch-results-*
          path: /tmp/batch_results
          merge-multiple: true

      - name: Aggregate results & write status files
        run: |
          set -e
          mkdir -p status

          # Matrix job outputs DON'T concatenate (shared key => only last value),
          # so per-batch results arrive as separate artifact files instead.
          if ls /tmp/batch_results/batch_*.json >/dev/null 2>&1; then
            jq -s -c '.' /tmp/batch_results/batch_*.json > /tmp/batch_results.json
          else
            echo '[]' > /tmp/batch_results.json
          fi

          BATCH_COUNT=$(jq 'length' /tmp/batch_results.json)
          TOTAL=$(jq '[.[].total] | add // 0' /tmp/batch_results.json)
          OK=$(jq '[.[].ok] | add // 0' /tmp/batch_results.json)
          FAILED_ARR=$(jq -c '[.[].failed[]?]' /tmp/batch_results.json)
          PARTIAL_ARR=$(jq -c '[.[].partial[]?]' /tmp/batch_results.json)
          UPFAIL_ARR=$(jq -c '[.[].upload_failed[]?]' /tmp/batch_results.json)
          FAILED_COUNT=$(echo "$FAILED_ARR" | jq 'length')
          PARTIAL_COUNT=$(echo "$PARTIAL_ARR" | jq 'length')
          UPFAIL_COUNT=$(echo "$UPFAIL_ARR" | jq 'length')

          CLEAN_SUMMARY=$(echo '${{ needs.cleanup.outputs.summary }}' | \
            jq -c 'if type=="object" then . else {"dirs":-1,"deleted":-1} end' 2>/dev/null || \
            echo '{"dirs":-1,"deleted":-1}')
          CLEAN_DIRS=$(echo "$CLEAN_SUMMARY" | jq -r '.dirs // -1')
          CLEAN_DEL=$(echo "$CLEAN_SUMMARY" | jq -r '.deleted // -1')
          if [ "$CLEAN_DIRS" -eq -1 ]; then
            CLEAN_TXT="skipped (RCLONE_REMOTE misconfigured)"
          else
            CLEAN_TXT="$CLEAN_DIRS server dir(s) scanned, $CLEAN_DEL old backup(s) deleted"
          fi

          case "${API_OK:-}" in
            true)  API_STATUS="OK (resource-filtered)" ;;
            false) API_STATUS="unavailable (full-backup fallback)" ;;
            *)     API_STATUS="unknown" ;;
          esac

          STARTED="$RUN_STARTED_AT"
          if [ -z "$STARTED" ] || [ "$STARTED" = "null" ]; then
            STARTED=$(gh run view "$RUN_ID" --json createdAt --jq '.createdAt' 2>/dev/null || true)
          fi
          if [ -z "$STARTED" ]; then
            STARTED="unknown"
            DUR_TXT="n/a"
          else
            START_EPOCH=$(date -d "$STARTED" +%s)
            NOW_EPOCH=$(date +%s)
            DUR=$((NOW_EPOCH - START_EPOCH))
            DUR_TXT=$(printf "%dm %02ds" $((DUR/60)) $((DUR%60)))
          fi

          case "$TRIGGER_NAME" in
            schedule) TRIGGER="scheduled (every 6h)" ;;
            push) TRIGGER="push (workflow change)" ;;
            workflow_dispatch) TRIGGER="manual" ;;
            *) TRIGGER="$TRIGGER_NAME" ;;
          esac
          if [ -n "$DEBUG_SERVER" ]; then
            TRIGGER="$TRIGGER (DEBUG: server $DEBUG_SERVER)"
          fi

          if [ "$FAILED_COUNT" -eq 0 ] && [ "$UPFAIL_COUNT" -eq 0 ]; then
            RESULT="SUCCESS"; RESULT_ICON=":white_check_mark:"
          else
            RESULT="PARTIAL"; RESULT_ICON=":warning:"
          fi

          FAILED_TABLE=$(echo "$FAILED_ARR" | jq -r '.[] | "| \(.host) | \(.reason) |"')
          [ -z "$FAILED_TABLE" ] && FAILED_TABLE="| - | None |"
          PARTIAL_TABLE=$(echo "$PARTIAL_ARR" | jq -r '.[] | "| \(.host) | \(.reason) |"')
          [ -z "$PARTIAL_TABLE" ] && PARTIAL_TABLE="| - | None |"
          UPFAIL_TABLE=$(echo "$UPFAIL_ARR" | jq -r '.[] | "| \(.host) | \(.reason) |"')
          [ -z "$UPFAIL_TABLE" ] && UPFAIL_TABLE="| - | None |"

          BATCH_TABLE=$(jq -r '.[] | "| \(.batch) | \(.total) | \(.ok) | \(.failed | length) |"' \
            /tmp/batch_results.json)

          cat > status/latest.md << EOF
          # Coolify Backup - Status Report

          | | |
          |---|---|
          | **Run** | #${{ github.run_number }} (id \`$RUN_ID\`) |
          | **Trigger** | $TRIGGER |
          | **Started** | $STARTED |
          | **Duration** | $DUR_TXT |
          | **Result** | $RESULT_ICON $RESULT |
          | **API resource mapping** | $API_STATUS |

          ## Summary

          - **Servers**: $TOTAL (in $BATCH_COUNT batch(es))
          - **Backup OK**: $OK
          - **Failed**: $FAILED_COUNT
          - **Partial (fallback / missing data)**: $PARTIAL_COUNT
          - **Upload failed**: $UPFAIL_COUNT
          - **Cleanup**: $CLEAN_TXT

          ## Failed hosts

          | Host | Reason |
          |---|---|
          $FAILED_TABLE

          ## Partial backups

          | Host | Reason |
          |---|---|
          $PARTIAL_TABLE

          ## Upload failures

          | Host | Reason |
          |---|---|
          $UPFAIL_TABLE

          ## Per-batch

          | Batch | Total | OK | Failed |
          |---|---|---|---|
          $BATCH_TABLE
          EOF

          {
            echo
            echo "## Run #${{ github.run_number }} - $STARTED - $RESULT - $DUR_TXT - $OK/$TOTAL OK"
            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo "Failed: $(echo "$FAILED_ARR" | jq -r '[.[] | "\(.host) (\(.reason))"] | join(", ")')"
            else
              echo "Failed: none"
            fi
          } > /tmp/history_block.md
          # Keep the H1 header pinned at the TOP; strip any header already in
          # the old file before prepending the new block.
          if [ -f status/history.md ]; then
            {
              echo "# Coolify Backup - Run History"
              echo
              cat /tmp/history_block.md
              grep -v '^# Coolify Backup - Run History' status/history.md | sed '/./,$!d'
            } > /tmp/history_new.md
            mv /tmp/history_new.md status/history.md
          else
            echo "# Coolify Backup - Run History" > status/history.md
            cat /tmp/history_block.md >> status/history.md
          fi
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          TRIGGER_NAME: ${{ github.event_name }}
          DEBUG_SERVER: ${{ inputs.debug_server }}
          API_OK: ${{ needs.get-servers.outputs.api_ok }}
          GH_TOKEN: ${{ github.token }}

      - name: Commit & push status branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/
          if git diff --cached --quiet; then
            echo "No status changes"
          else
            git commit -m "status: run #${{ github.run_number }} ($RUN_ID)"
            if git push origin status; then
              echo "Pushed status files"
            else
              echo "Push conflict, rebasing..."
              git fetch origin status
              git rebase origin/status
              git push origin status
            fi
          fi
        env:
          RUN_ID: ${{ github.run_id }}

      - name: Clean old action runs (keep latest 5)
        run: |
          KEEP=5
          CURRENT="$RUN_ID"
          gh run list --limit 200 --json databaseId,status,createdAt \
            | jq -r '.[] | select(.status=="completed") | [.createdAt,.databaseId] | @tsv' \
            | sort -r > /tmp/runs.tsv
          KEPT=0
          while IFS=$'\t' read -r created id; do
            [ "$id" = "$CURRENT" ] && continue
            if [ "$KEPT" -lt "$KEEP" ]; then
              KEPT=$((KEPT+1))
              continue
            fi
            echo "Deleting run $id ($created)"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" 2>/dev/null \
              || echo "::warning::failed to delete run $id"
          done < /tmp/runs.tsv
          echo "History cleanup done (kept latest $KEEP + current)"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
