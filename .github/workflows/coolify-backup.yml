name: Coolify Backup

on:
  push:
    branches: [master]
    paths: ['.github/workflows/coolify-backup.yml']
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      debug_server:          # Debug: backup only this single server IP
        description: 'DEBUG: only backup this server IP (empty = all servers)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  get-servers:
    runs-on: ubuntu-latest
    outputs:
      servers_json: ${{ steps.fetch.outputs.servers_json }}
      server_count: ${{ steps.fetch.outputs.server_count }}
      batch_list: ${{ steps.fetch.outputs.batch_list }}
    steps:
      - name: Fetch server list from Coolify API
        id: fetch
        run: |
          # Number of parallel matrix batches (tune as needed)
          MATRIX_BATCHES=10

          if [ -n "$DEBUG_SERVER" ]; then
            # DEBUG MODE: backup only the single server provided via workflow_dispatch
            MATRIX_BATCHES=1
            SERVERS_JSON=$(echo "$DEBUG_SERVER" | jq -R -c '[.]')
            SERVER_COUNT=1
          else
            RESPONSE=$(curl -s -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$COOLIFY_API_URL/servers")

            SERVERS_JSON=$(echo "$RESPONSE" | jq -c '[.[].ip]')
            SERVER_COUNT=$(echo "$SERVERS_JSON" | jq 'length')

            if [ "$SERVER_COUNT" -eq 0 ]; then
              echo "::error::No servers returned by API. Check COOLIFY_API_URL and COOLIFY_API_TOKEN."
              exit 1
            fi
          fi

          # Dynamic matrix: batches, servers are divided evenly later
          BATCH_LIST=$(seq 0 $((MATRIX_BATCHES - 1)) | jq -c -s '.')

          echo "servers_json=$SERVERS_JSON" >> $GITHUB_OUTPUT
          echo "server_count=$SERVER_COUNT" >> $GITHUB_OUTPUT
          echo "batch_list=$BATCH_LIST" >> $GITHUB_OUTPUT
          echo "Found $SERVER_COUNT servers, running $MATRIX_BATCHES parallel batches"
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEBUG_SERVER: ${{ inputs.debug_server }}

  backup:
    needs: get-servers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: ${{ fromJSON(needs.get-servers.outputs.batch_list) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            User root
            IdentitiesOnly yes
            BatchMode yes
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone rsync jq
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Backup servers in parallel
        run: |
          # Divide servers evenly across 10 batches (ceil division)
          MATRIX_BATCHES=10
          BATCH_SIZE=$(( (SERVER_COUNT + MATRIX_BATCHES - 1) / MATRIX_BATCHES ))
          START=$((MATRIX_BATCH * BATCH_SIZE))
          END=$((START + BATCH_SIZE))

          SERVERS=$(echo "$SERVERS_JSON" | jq -r '.[]' | \
            sed -n "$((START+1)),${END}p")

          if [ -z "$SERVERS" ]; then
            echo "No servers in this batch"
            exit 0
          fi

          echo "Backing up servers: $SERVERS"

          cat > backup_server.sh << 'SCRIPT'
          #!/bin/bash
          SERVER_IP=$1
          BACKUP_DIR="./backups/$SERVER_IP"
          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          REMOTE_FILE="/tmp/coolify_backup_${TIMESTAMP}.tar.gz"
          LOG_FILE="/tmp/backup_${SERVER_IP}.log"
          exec > >(tee "$LOG_FILE") 2>&1

          echo "Starting backup: $SERVER_IP"

          timeout 600 ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -i ~/.ssh/id_rsa "root@$SERVER_IP" "
            cd /tmp && \
            tar czf coolify_data.tar.gz -C / data/coolify 2>/dev/null && \
            (docker volume ls -q 2>/dev/null | xargs -P 5 -I {} \
              docker run --rm -v {}:/data -v /tmp:/backup alpine \
              tar czf /backup/vol_{}.tar.gz -C / data 2>/dev/null); \
            tar czf $REMOTE_FILE coolify_data.tar.gz \$(ls vol_*.tar.gz 2>/dev/null) && \
            rm -f coolify_data.tar.gz vol_*.tar.gz
          " || { echo "SSH failed: $SERVER_IP"; exit 1; }

          timeout 600 scp -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -i ~/.ssh/id_rsa \
            "root@$SERVER_IP:$REMOTE_FILE" "$BACKUP_DIR/" || \
            { echo "scp failed: $SERVER_IP"; exit 1; }

          echo "scp done for $SERVER_IP. Contents of $BACKUP_DIR:"
          ls -la "$BACKUP_DIR"
          du -sh "$BACKUP_DIR" 2>/dev/null || true

          timeout 60 ssh -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -i ~/.ssh/id_rsa "root@$SERVER_IP" "rm -f $REMOTE_FILE" 2>/dev/null

          echo "Completed: $SERVER_IP"
          SCRIPT
          chmod +x backup_server.sh

          echo "$SERVERS" | xargs -P 10 -I {} bash backup_server.sh {}
        env:
          SERVERS_JSON: ${{ needs.get-servers.outputs.servers_json }}
          SERVER_COUNT: ${{ needs.get-servers.outputs.server_count }}
          MATRIX_BATCH: ${{ matrix.batch }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload batch backups to remote
        id: upload
        if: always()
        run: |
          echo "=== DEBUG: upload step start ==="
          echo "pwd: $(pwd)"
          echo "--- files under ./backups (with sizes) ---"
          find ./backups -type f -printf '%p %s bytes\n' 2>/dev/null || echo "(no ./backups dir)"
          echo "--- dir listing ---"
          ls -laR ./backups 2>/dev/null | head -40 || true
          echo "--- RCLONE_REMOTE format check (no secret leaked) ---"
          if [ -z "$RCLONE_REMOTE" ]; then
            echo "::error::RCLONE_REMOTE is EMPTY (misconfigured secret?)"
            exit 1
          elif [[ "$RCLONE_REMOTE" =~ ^[A-Za-z0-9_]+: ]]; then
            echo "RCLONE_REMOTE has remote: prefix (looks OK)"
          else
            echo "::error::RCLONE_REMOTE must be '<remote-name>:<base-path>' (e.g. 'hf:coolify-backups'). Current value has NO 'remote:' prefix, so rclone treats it as a LOCAL path and backups are silently lost on the runner. Fix the RCLONE_REMOTE secret."
            echo "::error::Configured remotes: $(rclone listremotes 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          # Validate the referenced remote actually exists in RCLONE_CONFIG
          REMOTE_NAME="${RCLONE_REMOTE%%:*}"
          if ! rclone listremotes 2>/dev/null | grep -qx "${REMOTE_NAME}:"; then
            echo "::error::rclone remote '${REMOTE_NAME}' not found in RCLONE_CONFIG. Add it to the RCLONE_CONFIG secret or fix RCLONE_REMOTE."
            exit 1
          fi
          echo "--- configured remotes ---"
          rclone listremotes 2>&1 || true
          echo "--- remote root listing BEFORE upload ---"
          rclone lsf "$RCLONE_REMOTE/" --max-depth 2 2>&1 | head -20 || true
          echo "=== DEBUG end ==="

          if [ ! -d "./backups" ] || [ -z "$(ls -A ./backups 2>/dev/null)" ]; then
            echo "No backups to upload"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for dir in ./backups/*/; do
            SERVER_IP=$(basename "$dir")
            echo "Uploading backups for $SERVER_IP..."
            rclone copy "$dir" "$RCLONE_REMOTE/$SERVER_IP/" \
              --transfers 4 \
              --checkers 8 \
              --stats 30s \
              --stats-one-line || { echo "rclone copy FAILED for $SERVER_IP"; exit 1; }
            echo "  -> remote listing after copy for $SERVER_IP:"
            rclone lsf "$RCLONE_REMOTE/$SERVER_IP/" 2>&1 | head -10 || true
          done

          echo "All uploads complete"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}

      - name: Cleanup local
        # always() is REQUIRED: without it, GitHub skips the step entirely
        # (without evaluating `if:`) when any earlier step in the job failed.
        if: always() && steps.upload.outputs.uploaded == 'true'
        run: rm -rf ./backups/

      - name: Upload backup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-logs-batch-${{ matrix.batch }}
          path: /tmp/backup*.log
          retention-days: 7

  cleanup:
    needs: [get-servers, backup]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Setup rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

      - name: Cleanup old backups (keep max 5)
        run: |
          echo "=== DEBUG: cleanup start ==="
          echo "--- RCLONE_REMOTE format check (no secret leaked) ---"
          if [ -z "$RCLONE_REMOTE" ]; then
            echo "::error::RCLONE_REMOTE is EMPTY (misconfigured secret?)"
            exit 1
          elif [[ "$RCLONE_REMOTE" =~ ^[A-Za-z0-9_]+: ]]; then
            echo "RCLONE_REMOTE has remote: prefix (looks OK)"
          else
            echo "::error::RCLONE_REMOTE must be '<remote-name>:<base-path>' (e.g. 'hf:coolify-backups'). Current value has NO 'remote:' prefix, so rclone treats it as a LOCAL path and backups are silently lost on the runner. Fix the RCLONE_REMOTE secret."
            echo "::error::Configured remotes: $(rclone listremotes 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          # Validate the referenced remote actually exists in RCLONE_CONFIG
          REMOTE_NAME="${RCLONE_REMOTE%%:*}"
          if ! rclone listremotes 2>/dev/null | grep -qx "${REMOTE_NAME}:"; then
            echo "::error::rclone remote '${REMOTE_NAME}' not found in RCLONE_CONFIG. Add it to the RCLONE_CONFIG secret or fix RCLONE_REMOTE."
            exit 1
          fi
          echo "--- configured remotes ---"
          rclone listremotes 2>&1 || true
          echo "=== DEBUG end ==="

          echo "Cleaning up old backups..."

          SERVERS=$(rclone lsf "$RCLONE_REMOTE/" --dirs-only | tr -d '/')

          for SERVER_IP in $SERVERS; do
            echo "Processing: $SERVER_IP"

            BACKUPS=$(rclone lsl "$RCLONE_REMOTE/$SERVER_IP/" | \
              awk '{print $4}' | \
              grep "\.tar\.gz$" | \
              sort)

            COUNT=$(echo "$BACKUPS" | wc -l)

            if [ "$COUNT" -gt 5 ]; then
              DELETE_COUNT=$((COUNT - 5))
              echo "  Deleting $DELETE_COUNT old backups..."

              echo "$BACKUPS" | head -n "$DELETE_COUNT" | while read FILE; do
                if [ -n "$FILE" ]; then
                  echo "  Deleting: $FILE"
                  rclone delete "$RCLONE_REMOTE/$SERVER_IP/$FILE"
                fi
              done
            else
              echo "  Keeping all $COUNT backups (<= 5)"
            fi
          done

          echo "Cleanup complete"
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
